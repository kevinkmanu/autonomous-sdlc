name: Bug report
description: Report an observable defect for triage and planning.
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and affected paths
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security confirmation
      options:
        - label: This report does not include secrets, credentials, private keys, or production data.
          required: true
