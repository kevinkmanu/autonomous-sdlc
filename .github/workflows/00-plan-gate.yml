name: Plan Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "plans/**"
      - "governance/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-plan:
    name: Validate plan contract and governance
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == github.event.repository.default_branch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository contracts
        run: npm run validate:json && npm run validate:agents

      - name: Validate authorization implementation
        run: npm run validate:plan-acceptance

      - name: Validate policy inputs
        shell: bash
        run: |
          set -euo pipefail
          conftest_version="0.69.0"
          curl --fail --silent --show-error --location \
            "https://github.com/open-policy-agent/conftest/releases/download/v${conftest_version}/conftest_${conftest_version}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp
          /tmp/conftest verify --policy governance/policies

      - name: Require plan metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'PLAN-[0-9]+' <<< "${PR_BODY:-}" || {
            echo "Plan PR body must reference a PLAN-#### identifier."
            exit 1
          }
          grep -qi 'acceptance criteria' <<< "${PR_BODY:-}" || {
            echo "Plan PR body must include acceptance criteria."
            exit 1
          }
