name: Implementation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CONFTEST_VERSION: 0.69.0

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp
          echo "/tmp" >> "$GITHUB_PATH"
          /tmp/conftest --version

      - name: Install dependencies
        run: npm ci

      - name: Run package checks
        shell: bash
        run: |
          set -euo pipefail
          if npm run | grep -qE '^  (build|typecheck|lint)$'; then
            npm run build --if-present
            npm run typecheck --if-present
            npm run lint --if-present
          else
            echo "No build, typecheck, or lint scripts are configured; repository validation remains authoritative."
          fi

      - name: Run repository verification
        run: npm run verify
