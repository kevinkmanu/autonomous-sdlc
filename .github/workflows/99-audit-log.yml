name: Governance Audit Log

on:
  pull_request:
    types: [opened, closed, converted_to_draft, ready_for_review]
  workflow_run:
    workflows:
      - Plan Gate
      - Implementation CI
      - Test Quality
      - Security Scanning
      - Policy Enforcement
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  audit:
    name: Record governance event
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit store
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/agent-state/audit
          printf '{"timestamp":"%s","event":"%s","action":"%s","actor":"%s","sha":"%s","run_id":"%s","pr":"%s","workflow":"%s","conclusion":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${EVENT_NAME}" "${EVENT_ACTION}" "${ACTOR}" "${SHA}" "${RUN_ID}" \
            "${PR_NUMBER:-}" "${WORKFLOW_NAME:-}" "${WORKFLOW_CONCLUSION:-}" \
            >> .github/agent-state/audit/events.jsonl

      - name: Publish audit event
        uses: EndBug/add-and-commit@v9
        with:
          add: .github/agent-state/audit/events.jsonl
          message: "chore: record governance audit event"
          default_author: github_actions
