version: 1

policy:
  default: review-required
  blocked_licenses:
    - GPL-3.0-only
    - GPL-3.0-or-later
    - AGPL-3.0-only
    - AGPL-3.0-or-later
  blocked_severity: high
  require_lockfile_update: true
  require_plan_declaration: true
  require_security_review_for:
    - runtime
    - authentication
    - cryptography
    - data-processing

allowed_scopes:
  - "@types/**"
  - "@typescript-eslint/**"
  - "eslint/**"
  - "prettier/**"
  - "vitest"
  - "@vitest/**"
  - "@stryker-mutator/**"
  - "yaml"
  - "ajv"

approved_licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - CC0-1.0
